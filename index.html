<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GKS Neon Dash 2028</title>
    <style>
        body { margin: 0; background: #06060c; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: system-ui, sans-serif; overflow: hidden; color: #fff; }
        #gameContainer { position: relative; box-shadow: 0 0 50px rgba(0, 255, 255, 0.3); border-radius: 16px; overflow: hidden; border: 2px solid #00ffff; }
        canvas { display: block; background: #0a0a14; }
        #ui { position: absolute; top: 20px; left: 25px; font-size: 24px; font-weight: bold; color: #00ffff; text-shadow: 0 0 10px #00ffff; pointer-events: none; }
        #instructions { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 15px; color: #ff007f; font-weight: bold; pointer-events: none; text-shadow: 0 0 8px rgba(255,0,127,0.5); }
        #gameOverScreen { position: absolute; top: 0; left: 0; width: 500px; height: 700px; background: rgba(6, 6, 12, 0.93); display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); display: none; }
        h1 { font-size: 44px; margin: 0 0 15px 0; color: #ff007f; text-shadow: 0 0 20px #ff007f; text-align: center; }
        button { background: linear-gradient(45deg, #00ffff, #ff007f); border: none; padding: 14px 35px; font-size: 18px; color: white; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 20px rgba(0,255,255,0.4); transition: 0.3s; }
        button:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(255,0,127,0.6); }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">SCORE: <span id="scoreVal">0</span></div>
    <div id="instructions">اضغطي بالماوس (كليك شمال) أو زر المسافة للقفز السريع وتفادي المنصات المتحركة الشبيهة بالأركيد!</div>
    <canvas id="gameCanvas" width="500" height="700"></canvas>
    
    <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <p style="font-size: 20px; margin-bottom: 30px; color: #a29bfe;">النقاط المحققة: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">إعادة التحدي السريع</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let gameActive = true;

let player = {
    x: 100, y: 350, radius: 14, vy: 0,
    gravity: 0.45, jumpForce: -8, color: "#00ffff"
};

let walls = [];
let particles = [];
let wallSpeed = 3.5;
let spawnTimer = 0;

window.addEventListener("keydown", (e) => { if(e.code === "Space") playerJump(); });
canvas.addEventListener("mousedown", playerJump);

function playerJump() {
    if(!gameActive) return;
    player.vy = player.jumpForce;
    for(let i=0; i<8; i++) {
        particles.push({
            x: player.x, y: player.y,
            vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
            size: Math.random() * 3 + 2, color: "#ff007f", alpha: 1
        });
    }
}

function spawnWall() {
    let gap = 150; 
    let minHeight = 60;
    let maxHeight = canvas.height - gap - minHeight;
    let topWallHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
    
    walls.push({
        x: canvas.width, topHeight: topWallHeight, bottomY: topWallHeight + gap,
        width: 55, passed: false, color: "#ff007f"
    });
}

function update() {
    if(!gameActive) return;

    player.vy += player.gravity;
    player.y += player.vy;

    if (player.y - player.radius < 0 || player.y + player.radius > canvas.height) {
        endGame();
    }

    spawnTimer++;
    if(spawnTimer > 85) {
        spawnWall();
        spawnTimer = 0;
        if(wallSpeed < 7) wallSpeed += 0.12; 
    }

    for(let i = walls.length - 1; i >= 0; i--) {
        walls[i].x -= wallSpeed;

        let hitTop = player.x + player.radius > walls[i].x && player.x - player.radius < walls[i].x + walls[i].width && player.y - player.radius < walls[i].topHeight;
        let hitBottom = player.x + player.radius > walls[i].x && player.x - player.radius < walls[i].x + walls[i].width && player.y + player.radius > walls[i].bottomY;

        if (hitTop || hitBottom) {
            endGame();
        }

        if(walls[i].x + walls[i].width < player.x && !walls[i].passed) {
            walls[i].passed = true;
            score++;
            document.getElementById("scoreVal").innerText = score;
        }

        if(walls[i].x + walls[i].width < 0) walls.splice(i, 1);
    }

    for(let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].alpha -= 0.025;
        if(particles[i].alpha <= 0) particles.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    });

    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = player.color;
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    walls.forEach(w => {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = w.color;
        ctx.fillStyle = w.color;
        ctx.fillRect(w.x, 0, w.width, w.topHeight);
        ctx.fillRect(w.x, w.bottomY, w.width, canvas.height - w.bottomY);
        ctx.restore();
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function endGame() {
    gameActive = false;
    document.getElementById("finalScore").innerText = score;
    document.getElementById("gameOverScreen").style.display = "flex";
}

function resetGame() {
    score = 0;
    document.getElementById("scoreVal").innerText = "0";
    walls = [];
    particles = [];
    wallSpeed = 3.5;
    player.y = 350;
    player.vy = 0;
    gameActive = true;
    document.getElementById("gameOverScreen").style.display = "none";
}

loop();
</script>
</body>
</html>
